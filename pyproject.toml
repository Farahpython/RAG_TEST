[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bm25s>=0.3.16",
    "fire>=0.7.1",
    "huggingface-hub>=2.4.0",
    "pydantic>=2.14.3",
    "rank-bm25>=0.2.2",
    "torch>=2.15.0",
    "transformers>=5.23.0",
    "tree-sitter>=0.26.1",
    "llm-sdk",
    "tree-sitter-python>=0.25.0",
    "markdown-it-py>=4.3.0",
    "langchain-text-splitters>=1.1.3",
    "sentence-transformers>=6.3.0",
    "nltk>=3.10.4",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }
